<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- indii.music current brand icon (spring green tile, cyan ii mark).
       Maskable-safe full-bleed variant of public/favicon.svg: no rounded outer
       corners, all content inside the 410x410 (80%) center safe area.
       Regenerate PWA PNGs after editing: node scripts/generate-pwa-icons.cjs -->
  <defs>
    <linearGradient id="tile-spring" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#36D96F"/>
      <stop offset="100%" stop-color="#0A703A"/>
    </linearGradient>
    <linearGradient id="mark-spring" x1="0" y1="126" x2="0" y2="386" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3BEAF0"/>
      <stop offset="100%" stop-color="#12C6D4"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#tile-spring)"/>
  <rect x="91" y="91" width="330" height="330" rx="92" fill="#06180D" stroke="url(#mark-spring)" stroke-width="12"/>
  <g transform="translate(256 256) scale(0.9) translate(-256 -256)">
    <circle cx="218" cy="155" r="29" fill="url(#mark-spring)"/>
    <circle cx="294" cy="155" r="29" fill="url(#mark-spring)"/>
    <rect x="189" y="208" width="58" height="178" rx="29" fill="url(#mark-spring)"/>
    <rect x="265" y="208" width="58" height="178" rx="29" fill="url(#mark-spring)"/>
  </g>
</svg>
