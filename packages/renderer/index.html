<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Brand fonts — Geist (display), Inter (UI), JetBrains Mono (data).
         The CSS declares all three; the CSP already allowlists
         fonts.googleapis.com / fonts.gstatic.com. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:wght@100..900&family=JetBrains+Mono:wght@100..800&display=swap"
      rel="stylesheet"
    />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Mobile Viewport - Optimized for touch -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover, interactive-widget=resizes-content"
    />

    <!-- Theme Colors -->
    <meta name="theme-color" content="#0f0f0f" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0f0f0f"
    />

    <!-- Apple Mobile Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="indii" />
    <!-- Item 396: iOS splash screen — prevents white flash on PWA launch -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-startup-image" href="/icon-web-512.png" />

    <!-- Microsoft Tiles -->
    <meta name="msapplication-TileColor" content="#0f0f0f" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Mobile Browser UI -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Item 363: Preconnect to Firebase for LCP improvement — reduces DNS + TLS handshake time -->
    <link
      rel="preconnect"
      href="https://firestore.googleapis.com"
      crossorigin="anonymous"
    />
    <link
      rel="preconnect"
      href="https://firebasestorage.googleapis.com"
      crossorigin="anonymous"
    />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />

    <title>indii.music — music business at the speed of you</title>

    <!-- SEO -->
    <meta
      name="description"
      content="indii.music — music business at the speed of you — your personal music business team: distribution, creative, legal, finance, and specialist agents, all in one studio."
    />
    <link rel="canonical" href="https://indii.music/" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://indii.music/" />
    <meta property="og:title" content="indii.music — music business at the speed of you" />
    <meta
      property="og:description"
      content="indii.music — music business at the speed of you — your personal team of specialists for independent music. Private launch — sign in to preview."
    />
    <meta property="og:image" content="https://indii.music/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="indii.music" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@indiidotmusic" />
    <meta name="twitter:title" content="indii.music — music business at the speed of you" />
    <meta
      name="twitter:description"
      content="indii.music — music business at the speed of you — your personal team of specialists for independent music."
    />
    <meta name="twitter:image" content="https://indii.music/og-image.png" />

    <!-- Critical Mobile Styles -->
    <style>
      /* Prevent white flash on load - set dark background immediately */
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #0f0f0f;
        color: #ffffff;
      }

      /* Prevent pull-to-refresh on mobile */
      body {
        overscroll-behavior-y: contain;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
      }

      /* Prevent text selection on long press (for UI elements, not content) */
      * {
        -webkit-tap-highlight-color: transparent;
      }

      /* Optimize font rendering on mobile */
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      /* Safe area support */
      :root {
        --safe-area-inset-top: env(safe-area-inset-top);
        --safe-area-inset-right: env(safe-area-inset-right);
        --safe-area-inset-bottom: env(safe-area-inset-bottom);
        --safe-area-inset-left: env(safe-area-inset-left);
      }

      /* Initial loading state - branded boot splash.
         Canonical brand pairing shown while the bundle loads:
         indii.music / music business at the speed of you
         The tagline here must stay identical to INDII_BRAND.tagline in
         packages/shared/src/brand.ts. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background-color: #0f0f0f;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 1.5rem;
      }

      #boot-splash .boot-splash__mark {
        font-size: 30px;
        font-weight: 900;
        letter-spacing: -0.03em;
      }

      #boot-splash .boot-splash__tagline {
        font-size: 12px;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.55);
        letter-spacing: 0.02em;
      }

      #boot-splash .boot-splash__spinner {
        width: 22px;
        height: 22px;
        margin-top: 6px;
        border: 2px solid rgba(255, 255, 255, 0.15);
        border-top-color: rgba(255, 255, 255, 0.8);
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <script src="./bootstrap.js" defer></script>
    <div id="boot-splash" role="status" aria-live="polite">
      <div class="boot-splash__mark">indii.music</div>
      <div class="boot-splash__tagline">music business at the speed of you</div>
      <div class="boot-splash__spinner" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/startupWatchdog.ts"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
