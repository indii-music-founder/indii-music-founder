steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'packages/render-worker/Dockerfile', '-t', '${_IMAGE}', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'run'
      - '--rm'
      - '--entrypoint'
      - 'node'
      - '${_IMAGE}'
      - '--input-type=module'
      - '--eval'
      - "await import('@indii/shared'); await import('@indii/video-compiler'); await import('./packages/render-worker/dist/job.js');"
images:
  - '${_IMAGE}'
timeout: '1800s'
