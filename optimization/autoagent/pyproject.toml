[project]
name = "indii-autoagent"
version = "0.1.0"
description = "AutoAgent sidecar for system prompt hill-climbing optimization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "requests>=2.31.0",
    "docker>=7.0.0",
    "pydantic>=2.0.0",
    "toml>=0.10.2",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "autoagent @ git+https://github.com/kevinrgu/autoagent.git"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
package = false


