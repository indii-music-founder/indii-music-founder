<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>indii — icon family</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; padding:44px 40px 80px; background:#0B140F;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#fff; }
  h1 { font-size:21px; font-weight:600; margin:0 0 6px; letter-spacing:-.01em; }
  p.sub { margin:0 0 8px; color:#8A9A91; font-size:14px; max-width:62ch; line-height:1.5; }
  code { background:#16211B; padding:1px 5px; border-radius:4px; font-size:12px; }
  h2 { font-size:11px; font-weight:600; color:#7d8f86; margin:44px 0 18px;
       text-transform:uppercase; letter-spacing:.09em; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:28px 18px; }
  figure { margin:0; text-align:center; position:relative; }
  .cw img { width:100%; aspect-ratio:1; display:block; }
  .cw img.sm { width:26px; margin:7px auto 0; }
  figcaption { margin-top:7px; font-size:12px; color:#cfe0d7; line-height:1.5; }
  figcaption span { display:block; font-size:9.5px; color:#6d7f76; font-variant-numeric:tabular-nums; }
  .tag { margin-top:4px; font-size:9px; letter-spacing:.09em; color:#3BEAF0; }
  .surfaces { display:flex; gap:44px; flex-wrap:wrap; }
  .surface img { width:132px; height:132px; display:block; }
  .surface figcaption { font-size:13px; }
</style>
</head>
<body>
  <h1>indii icon family</h1>
  <p class="sub">One recipe, fourteen hues. Shared silhouette, shared ink panel, shared cyan mark —
  only the tile hue rotates. Generated by <code>generate-icons.mjs</code>; do not hand-edit the SVGs.</p>

  <h2>Shipping surfaces</h2>
  <div class="surfaces">
      <figure class="surface">
        <img src="favicon-web.svg" alt="spring">
        <figcaption>web<span>spring</span></figcaption>
      </figure>
      <figure class="surface">
        <img src="favicon-electron.svg" alt="indigo">
        <figcaption>electron<span>indigo</span></figcaption>
      </figure>
      <figure class="surface">
        <img src="favicon-remote.svg" alt="orchid">
        <figcaption>remote<span>orchid</span></figcaption>
      </figure>
  </div>

  <h2>Full family — 104px, and at 26px</h2>
  <div class="grid">
      <figure class="cw">
        <img src="colorways/lime.svg" alt="lime">
        <img class="sm" src="colorways/lime.svg" alt="">
        <figcaption>lime<span>#7AD936 / #29700A</span></figcaption>
        
      </figure>
      <figure class="cw">
        <img src="colorways/grass.svg" alt="grass">
        <img class="sm" src="colorways/grass.svg" alt="">
        <figcaption>grass<span>#4BD936 / #0C700A</span></figcaption>
        
      </figure>
      <figure class="cw">
        <img src="colorways/kelly.svg" alt="kelly">
        <img class="sm" src="colorways/kelly.svg" alt="">
        <figcaption>kelly<span>#36D94B / #0A7024</span></figcaption>
        
      </figure>
      <figure class="cw">
        <img src="colorways/spring.svg" alt="spring">
        <img class="sm" src="colorways/spring.svg" alt="">
        <figcaption>spring<span>#36D96F / #0A703A</span></figcaption>
        <div class="tag">WEB</div>
      </figure>
      <figure class="cw">
        <img src="colorways/emerald.svg" alt="emerald">
        <img class="sm" src="colorways/emerald.svg" alt="">
        <figcaption>emerald<span>#36D995 / #0A7052</span></figcaption>
        
      </figure>
      <figure class="cw">
        <img src="colorways/jade.svg" alt="jade">
        <img class="sm" src="colorways/jade.svg" alt="">
        <figcaption>jade<span>#36D9B8 / #0A7068</span></figcaption>
        
      </figure>
      <figure class="cw">
        <img src="colorways/teal.svg" alt="teal">
        <img class="sm" src="colorways/teal.svg" alt="">
        <figcaption>teal<span>#36BDD9 / #0A5370</span></figcaption>
        
      </figure>
      <figure class="cw">
        <img src="colorways/azure.svg" alt="azure">
        <img class="sm" src="colorways/azure.svg" alt="">
        <figcaption>azure<span>#3682D9 / #0A2E70</span></figcaption>
        
      </figure>
      <figure class="cw">
        <img src="colorways/indigo.svg" alt="indigo">
        <img class="sm" src="colorways/indigo.svg" alt="">
        <figcaption>indigo<span>#3651D9 / #0A0F70</span></figcaption>
        <div class="tag">ELECTRON</div>
      </figure>
      <figure class="cw">
        <img src="colorways/violet.svg" alt="violet">
        <img class="sm" src="colorways/violet.svg" alt="">
        <figcaption>violet<span>#5636D9 / #2B0A70</span></figcaption>
        
      </figure>
      <figure class="cw">
        <img src="colorways/purple.svg" alt="purple">
        <img class="sm" src="colorways/purple.svg" alt="">
        <figcaption>purple<span>#9536D9 / #520A70</span></figcaption>
        
      </figure>
      <figure class="cw">
        <img src="colorways/orchid.svg" alt="orchid">
        <img class="sm" src="colorways/orchid.svg" alt="">
        <figcaption>orchid<span>#D936D9 / #700A64</span></figcaption>
        <div class="tag">REMOTE</div>
      </figure>
      <figure class="cw">
        <img src="colorways/magenta.svg" alt="magenta">
        <img class="sm" src="colorways/magenta.svg" alt="">
        <figcaption>magenta<span>#D936A2 / #700A42</span></figcaption>
        
      </figure>
      <figure class="cw">
        <img src="colorways/rose.svg" alt="rose">
        <img class="sm" src="colorways/rose.svg" alt="">
        <figcaption>rose<span>#D93671 / #700A24</span></figcaption>
        
      </figure>
  </div>
</body>
</html>
