<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>indii — the extended movie</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0c0f;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        /* Opaque stage ground — the mid-window seam cut must never flash white. */
        background: var(--canvas-deep, var(--canvas, #0b0c0f));
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-mrur" id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="78" data-fps="30">
      <div data-hf-id="hf-e207" id="el-act1" class="clip scene" data-composition-id="act1" data-composition-src="compositions/act1.html" data-start="0" data-duration="26" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-36u1" id="el-act2" class="clip scene" data-composition-id="act2" data-composition-src="compositions/act2.html" data-start="26" data-duration="26" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-icu0" id="el-act3" class="clip scene" data-composition-id="act3" data-composition-src="compositions/act3.html" data-start="52" data-duration="26" data-track-index="0" data-width="1920" data-height="1080"></div>

      <audio data-hf-id="hf-k7g0" id="bgm-audio" src=".media/audio/bgm/bgm_001.mp3" data-start="0" data-duration="78" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // BGM bed: fade in under Act I, fade out over the final lockup.
      tl.fromTo("#bgm-audio", { volume: 0 }, { volume: 0.55, duration: 2.5, ease: "none" }, 0);
      tl.to("#bgm-audio", { volume: 0, duration: 2.5, ease: "none" }, 74.5);

      window.__timelines["main"] = tl;

      // <seams:auto> — generated by seam-stamp.mjs from ledger.json; do not hand-edit.
      // Regenerate: node <motion-doctrine>/scripts/seam-stamp.mjs --ledger ledger.json --write index.html
      gsap.set("#el-act1", { autoAlpha: 1, xPercent: 0, yPercent: 0, scale: 1, filter: "blur(0px)", transformOrigin: "50% 50%" });
      gsap.set(["#el-act2","#el-act3"], { autoAlpha: 0, xPercent: 0, yPercent: 0, scale: 1, filter: "blur(0px)", transformOrigin: "50% 50%" });
      
      // SEAM — grind→machine : cut-the-curve LEFT (cut @26)
      tl.to("#el-act1", { xPercent: -12, autoAlpha: 0, duration: 0.34, ease: "power3.in" }, 25.66);
      tl.set("#el-act1", { autoAlpha: 0 }, 26);
      tl.fromTo("#el-act2", { xPercent: 10, autoAlpha: 0.35 }, { xPercent: 0, autoAlpha: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, 26);
      
      // SEAM — machine→release : cut-the-curve LEFT (cut @52)
      tl.to("#el-act2", { xPercent: -12, autoAlpha: 0, duration: 0.34, ease: "power3.in" }, 51.66);
      tl.set("#el-act2", { autoAlpha: 0 }, 52);
      tl.fromTo("#el-act3", { xPercent: 10, autoAlpha: 0.35 }, { xPercent: 0, autoAlpha: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, 52);
      
      // </seams:auto>
    </script>
  </body>
</html>
