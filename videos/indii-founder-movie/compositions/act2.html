      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // ── Ambient: grid breathes (finite), glow drifts
        tl.fromTo("#a2-grid", { opacity: 0.06 }, { opacity: 0.11, duration: 5, ease: "sine.inOut" }, 0);
        tl.to("#a2-grid", { opacity: 0.06, duration: 5, ease: "sine.inOut" }, 5);
        tl.to("#a2-glow", { scale: 1.09, duration: 26, ease: "none" }, 0);

        // ── "ONE ARTIST." waterfall entry
        const wordsTop = gsap.utils.toArray("#a2-top .w");
        wordsTop.forEach((w, i) => {
          const t = 0.3 + i * 0.14;
          tl.set(w, { y: 70, autoAlpha: 0 }, 0);
          tl.set(w, { autoAlpha: 1 }, t);
          tl.to(w, { y: 0, duration: 0.2, ease: "power4.out" }, t);
        });

        // ── Nudge curve (§7): slow-fast-slow slide up to make room
        // Total 160px: ramp-in ~10% (16px) / burst ~65% (104px) / tail ~25% (40px)
        tl.to("#a2-top", { y: -16, duration: 0.2, ease: "power3.in" }, 2.4);
        tl.to("#a2-top", { y: -120, duration: 0.17, ease: "none" }, 2.6);
        tl.to("#a2-top", { y: -160, duration: 0.62, ease: "power4.out" }, 2.79);

        // ── "A WHOLE COMPANY." reveals beneath
        const wordsCo = gsap.utils.toArray("#a2-company .w");
        wordsCo.forEach((w, i) => {
          const t = 3.3 + i * 0.13;
          tl.set(w, { y: 60, autoAlpha: 0 }, 0);
          tl.set(w, { autoAlpha: 1 }, t);
          tl.to(w, { y: 0, duration: 0.18, ease: "power4.out" }, t);
        });

        // ── Agent cards cascade in
        const cards = ["#a2-card1", "#a2-card2", "#a2-card3", "#a2-card4"];
        cards.forEach((sel, i) => {
          const t = 4.9 + i * 0.11;
          tl.set(sel, { y: 80, autoAlpha: 0 }, 0);
          tl.set(sel, { autoAlpha: 1 }, t);
          tl.to(sel, { y: 0, duration: 0.5, ease: "power4.out" }, t);
        });

        // ── Card readout lines: state 0 visible, then sequenced swaps
        gsap.utils.toArray("#a2-cards .line").forEach((line, i) => {
          tl.set(line, { autoAlpha: i % 3 === 0 ? 1 : 0 }, 0);
        });
        let prevTarget = 0;
        [1, 2, 1, 2].forEach((target, step) => {
          gsap.utils.toArray("#a2-cards .read").forEach((read) => {
            const lines = read.querySelectorAll(".line");
            const next = lines[target];
            const prev = lines[prevTarget];
            const t = 13.8 + step * 2.4;
            tl.set(prev, { autoAlpha: 0 }, t);
            tl.set(next, { y: 10, autoAlpha: 1 }, t);
            tl.to(next, { y: 0, duration: 0.2, ease: "power4.out" }, t);
          });
          prevTarget = target;
        });

        // ── Count-ups (seek-safe counters)
        const count = (sel, end, startAt, dur) => {
          const obj = { v: 0 };
          tl.to(obj, {
            v: end,
            duration: dur,
            ease: "power2.out",
            snap: { v: 1 },
            onUpdate: () => {
              document.getElementById(sel).textContent = String(Math.round(obj.v));
            },
          }, startAt);
        };
        count("a2-num1", 4, 8.4, 1.1);
        count("a2-num2", 24, 8.6, 1.3);
        count("a2-num3", 1, 8.8, 0.8);

        // ── Stats blocks + subline whip in
        ["#a2-num1", "#a2-num2", "#a2-num3"].forEach((_, i) => {
          const sel = ["#a2-num1", "#a2-num2", "#a2-num3"][i];
          tl.set(sel, { y: 30, autoAlpha: 0 }, 0);
          tl.set(sel, { autoAlpha: 1 }, 8.3 + i * 0.16);
          tl.to(sel, { y: 0, duration: 0.4, ease: "power4.out" }, 8.3 + i * 0.16);
        });
        tl.set("#a2-sub", { x: 60, autoAlpha: 0 }, 0);
        tl.set("#a2-sub", { autoAlpha: 1 }, 12.4);
        tl.to("#a2-sub", { x: 0, duration: 0.45, ease: "power4.out" }, 12.4);

        window.__timelines["act2"] = tl;
      </script>
