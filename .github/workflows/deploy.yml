name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'artifacts/**'
      - '.agent/**'
      - 'deep-test-*.png'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: read
  actions: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── Setup & Sanity Checks ──────────────────────────────────────────────────
  # Prepares dependencies and runs fast sanity checks to fail early.
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm install --prefer-offline --no-audit --no-fund

      - name: Sanity check - Duplicate identifiers (Item 342)
        run: |
          if [ -f packages/renderer/src/core/store/slices/appSlice.ts ]; then
            duplicates=$(grep -rn "^  _last\|^  _cached\|^  current\|^  is" packages/renderer/src/core/store/slices/appSlice.ts | sort | uniq -d)
            if [ -n "$duplicates" ]; then
              echo "::error::Duplicate identifiers found in appSlice.ts"
              echo "$duplicates"
              exit 1
            fi
          fi

      - name: Sanity check - Electron mocks
        run: |
          if [ -d packages/main/src ]; then
            missing_mocks=$(grep -rLE "vi\.(do)?[Mm]ock.*electron" packages/main/src --include="*.test.ts" | xargs grep -l "electron" 2>/dev/null || true)
            if [ -n "$missing_mocks" ]; then
              echo "::error::Missing vi.mock('electron') in packages/main/ tests"
              echo "$missing_mocks"
              exit 1
            fi
          fi

      - name: Frontend API boundary guard
        run: npm run security:frontend-api-boundary



  # ─── Unit Testing (Sharded) ────────────────────────────────────────────────
  # Item 344: Vitest test sharding — 8 parallel matrix jobs cut CI time and prevent OOM
  unit-tests:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Authenticate with Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if echo "$FIREBASE_SERVICE_ACCOUNT" | base64 -d >/dev/null 2>&1; then
            echo "$FIREBASE_SERVICE_ACCOUNT" | base64 -d > $HOME/gcloud-key.json
          else
            echo "$FIREBASE_SERVICE_ACCOUNT" > $HOME/gcloud-key.json
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcloud-key.json" >> $GITHUB_ENV

      - name: Run unit tests (shard ${{ matrix.shard }}/8)
        timeout-minutes: 15
        run: NODE_OPTIONS="--max-old-space-size=4096" npm test -- --run --reporter=verbose --testTimeout=30000 --bail=3 --shard=${{ matrix.shard }}/8
        env:
          VITE_VERTEX_PROJECT_ID: ${{ secrets.VITE_VERTEX_PROJECT_ID }}
          VITE_VERTEX_LOCATION: ${{ secrets.VITE_VERTEX_LOCATION }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: indii-music-founder

      - name: Cleanup credentials
        if: always()
        run: rm -f $HOME/gcloud-key.json

  # ─── Build & Static Analysis ────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Item 252: Security audit — non-blocking
      - name: Audit dependencies for vulnerabilities (Item 252)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Run linting checks
        run: npm run lint

      - name: TypeScript type check (Item 343)
        run: npm run typecheck

      - name: Build landing page
        run: |
          cd packages/landing
          rm -rf dist .next
          NODE_ENV=production npm run build
        env:
          NODE_ENV: production
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_APP_CHECK_KEY: ${{ secrets.VITE_FIREBASE_APP_CHECK_KEY }}
          VITE_INGESTION_SYSTEM_IDENTIFIER: indii-studio
          VITE_INGESTION_ENTITY_NAME: indii Music
          VITE_INGESTION_TRADING_NAME: indii
          VITE_INGESTION_CONTACT_NAME: indii Support
          VITE_INGESTION_CONTACT_EMAIL: support@indii.music
          VITE_INGESTION_CONTACT_ADDRESS: Detroit, MI
          VITE_INGESTION_CONTACT_PHONE: +1-844-INDII-01

      - name: Build studio app
        run: npm run build:studio
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          NODE_ENV: production
          VITE_APP_TARGET: web
          VITE_VERTEX_PROJECT_ID: ${{ secrets.VITE_VERTEX_PROJECT_ID }}
          VITE_VERTEX_LOCATION: ${{ secrets.VITE_VERTEX_LOCATION }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_APP_CHECK_KEY: ${{ secrets.VITE_FIREBASE_APP_CHECK_KEY }}
          VITE_ENABLE_GOOGLE_MAPS: "false"
          VITE_USE_FINE_TUNED_AGENTS: "true"
          VITE_INGESTION_SYSTEM_IDENTIFIER: indii-studio
          VITE_INGESTION_ENTITY_NAME: indii Music
          VITE_INGESTION_TRADING_NAME: indii
          VITE_INGESTION_CONTACT_NAME: indii Support
          VITE_INGESTION_CONTACT_EMAIL: support@indii.music
          VITE_INGESTION_CONTACT_ADDRESS: Detroit, MI
          VITE_INGESTION_CONTACT_PHONE: +1-844-INDII-01

      - name: Verify build outputs
        run: |
          ls -la packages/landing/dist/index.html
          ls -la dist/renderer/index.html

      - name: Bundle size check
        run: |
          TOTAL_JS=$(find dist/renderer/assets -name '*.js' -print0 | xargs -0 cat | wc -c)
          TOTAL_KB=$((TOTAL_JS / 1024))
          echo "Total JS: ${TOTAL_KB}KB ($(echo "scale=1; $TOTAL_KB / 1024" | bc)MB)"
          # Threshold: 30MB
          if [ "$TOTAL_JS" -gt 31457280 ]; then
            echo "::error::Total JS bundle exceeds 30MB threshold! Current: ${TOTAL_KB}KB"
            exit 1
          fi

      - name: Upload Sentry Sourcemaps
        if: env.SENTRY_ORG != '' && env.SENTRY_AUTH_TOKEN != ''
        uses: getsentry/action-release@v3
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          sourcemaps: dist/renderer
          ignore_missing: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dist-${{ github.sha }}
          path: |
            dist/
            packages/landing/dist/
          retention-days: 1

  # ─── Staging Deploy ──────────────────────────────────────────────────────────
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      staging-url: ${{ steps.channel-deploy.outputs.staging_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist-${{ github.sha }}

      - name: Authenticate with Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if echo "$FIREBASE_SERVICE_ACCOUNT" | base64 -d >/dev/null 2>&1; then
            echo "$FIREBASE_SERVICE_ACCOUNT" | base64 -d > $HOME/gcloud-key.json
          else
            echo "$FIREBASE_SERVICE_ACCOUNT" > $HOME/gcloud-key.json
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcloud-key.json" >> $GITHUB_ENV

      - name: Deploy to staging preview channel
        id: channel-deploy
        run: |
          set -uo pipefail
          # Ensure the PINNED firebase-tools is installed locally so `npx` uses it
          # instead of fetching the latest from npm on a cache miss (ISSUE-498).
          npm install --prefer-offline --no-audit --no-fund
          echo "::notice::firebase-tools $(npx --no-install firebase --version)"
          node -e "console.log('GAC set:', !!process.env.GOOGLE_APPLICATION_CREDENTIALS, '| file exists:', require('fs').existsSync(process.env.GOOGLE_APPLICATION_CREDENTIALS||''))"
          set +e
          OUTPUT=$(npx --no-install firebase hosting:channel:deploy staging \
            --project indii-music-founder \
            --expires 2h \
            --only app \
            --json)
          EXIT_CODE=$?
          set -e
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Firebase deploy failed"
            echo "$OUTPUT"
            exit $EXIT_CODE
          fi
          
          STAGING_URL=$(echo "$OUTPUT" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          results = d.get('result', {})
          url = next(iter(results.values()), {}).get('url', '')
          if not url:
              sys.exit(1)
          print(url)
          ")
          echo "staging_url=${STAGING_URL}" >> $GITHUB_OUTPUT

      - name: Cleanup credentials
        if: always()
        run: rm -f $HOME/gcloud-key.json

  # ─── E2E Smoke Tests Against Staging ─────────────────────────────────────────
  # NOTE: no continue-on-error. A real e2e failure must set this job's result to
  # 'failure' so the deploy-production gate (needs.e2e-staging.result == 'success')
  # actually blocks a bad deploy. With continue-on-error the job result stayed
  # 'success' even when tests failed, silently letting broken builds reach prod.
  e2e-staging:
    runs-on: ubuntu-latest
    needs: deploy-staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests against staging
        run: npx playwright test e2e/navigation.spec.ts e2e/auth-flow.spec.ts --project=chromium --timeout=30000
        timeout-minutes: 15
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy-staging.outputs.staging-url }}
          E2E_STUDIO_URL: ${{ needs.deploy-staging.outputs.staging-url }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: indii-music-founder
          VITE_FIREBASE_E2E_MOCK: 'true'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 1

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 1

  # ─── Production Deploy ──────────────────────────────────────────────────────
  deploy-production:
    runs-on: ubuntu-latest
    needs: [deploy-staging, e2e-staging]
    if: ${{ always() && needs.deploy-staging.result == 'success' && needs.e2e-staging.result == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist-${{ github.sha }}

      - name: Authenticate with Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if echo "$FIREBASE_SERVICE_ACCOUNT" | base64 -d >/dev/null 2>&1; then
            echo "$FIREBASE_SERVICE_ACCOUNT" | base64 -d > $HOME/gcloud-key.json
          else
            echo "$FIREBASE_SERVICE_ACCOUNT" > $HOME/gcloud-key.json
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcloud-key.json" >> $GITHUB_ENV
          gcloud auth activate-service-account --key-file="$HOME/gcloud-key.json" --project=indii-music-founder

      - name: Ensure pinned firebase-tools + verify credentials (ISSUE-498)
        run: |
          # Install the PINNED firebase-tools so `npx --no-install` uses it instead
          # of fetching latest from npm on a cache miss.
          npm install --prefer-offline --no-audit --no-fund
          echo "::notice::firebase-tools $(npx --no-install firebase --version)"
          node -e "console.log('GAC set:', !!process.env.GOOGLE_APPLICATION_CREDENTIALS, '| file exists:', require('fs').existsSync(process.env.GOOGLE_APPLICATION_CREDENTIALS||''))"

      - name: Repair Firebase web API key restrictions
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: |
          set -euo pipefail

          gcloud services enable apikeys.googleapis.com cloudbilling.googleapis.com \
            --project indii-music-founder \
            --quiet

          KEY_RESOURCE=$(gcloud services api-keys lookup "$VITE_FIREBASE_API_KEY" \
            --project indii-music-founder \
            --format='value(name)')

          if [ -z "$KEY_RESOURCE" ]; then
            echo "::error::Unable to resolve VITE_FIREBASE_API_KEY to an API key resource."
            exit 1
          fi

          gcloud services api-keys update "$KEY_RESOURCE" \
            --project indii-music-founder \
            --allowed-referrers="https://app.indii.music/*,https://indii.music/*,https://www.indii.music/*,https://founder.indii.music/*,https://indii-music-studio.web.app/*,https://indii-music-studio.firebaseapp.com/*,https://indii-music-founder.web.app/*,https://indii-music-founder.firebaseapp.com/*" \
            --api-target=service=identitytoolkit.googleapis.com \
            --api-target=service=securetoken.googleapis.com \
            --api-target=service=firestore.googleapis.com \
            --api-target=service=firebasestorage.googleapis.com \
            --api-target=service=firebaseinstallations.googleapis.com \
            --api-target=service=firebaseappcheck.googleapis.com \
            --api-target=service=firebaseremoteconfig.googleapis.com \
            --api-target=service=firebasevertexai.googleapis.com \
            --api-target=service=firebaselogging-pa.googleapis.com \
            --api-target=service=fcmregistrations.googleapis.com \
            --quiet

      - name: Validate Firebase Auth password sign-in API availability
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const apiKey = process.env.VITE_FIREBASE_API_KEY;
          if (!apiKey) {
            throw new Error('VITE_FIREBASE_API_KEY is not configured.');
          }

          const blockedNeedles = [
            'PERMISSION_DENIED',
            'blocked',
            'requests-to-this-api-identitytoolkit-method',
          ];

          const referrers = [
            'https://app.indii.music/',
            'https://indii.music/',
            'https://www.indii.music/',
            'https://founder.indii.music/',
          ];

          for (const referer of referrers) {
            let reachedCredentialValidation = false;
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              const response = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${encodeURIComponent(apiKey)}`, {
                method: 'POST',
                headers: {
                  'content-type': 'application/json',
                  referer,
                },
                body: JSON.stringify({
                  email: 'ci-auth-probe@example.invalid',
                  password: 'not-a-real-password',
                  returnSecureToken: true,
                }),
              });
              const body = await response.json().catch(() => ({}));
              const status = body?.error?.status || '';
              const message = body?.error?.message || '';
              const combined = `${status} ${message}`.toLowerCase();

              if (!blockedNeedles.some((needle) => combined.includes(needle.toLowerCase()))) {
                console.log(`Firebase Auth password sign-in API reached expected credential validation path for ${referer} on attempt ${attempt}.`);
                reachedCredentialValidation = true;
                break;
              }

              if (attempt < 12) {
                await new Promise((resolve) => setTimeout(resolve, 5000));
              }
            }

            if (!reachedCredentialValidation) {
              throw new Error(`Firebase Auth password sign-in API is still blocked for ${referer}.`);
            }
          }
          NODE

      - name: Sync Gemini backend secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::warning::GEMINI_API_KEY GitHub secret is not configured; keeping existing Secret Manager version."
            exit 0
          fi

          printf '%s' "$GEMINI_API_KEY" | gcloud secrets versions add GEMINI_API_KEY \
            --project indii-music-founder \
            --data-file=-

      - name: Deploy landing page to Firebase Hosting
        run: npx --no-install firebase deploy --only hosting:landing --project indii-music-founder --non-interactive

      - name: Deploy studio app to Firebase Hosting
        run: npx --no-install firebase deploy --only hosting:app --project indii-music-founder --non-interactive

      - name: Deploy Cloud Functions
        env:
          INFLUENCER_BOUNTY_BASE_URL: https://app.indii.music
        run: |
          # Firebase Tools copies stale CPU metadata from existing gen1 endpoints
          # during deploy validation. These two functions were created with bad
          # remote metadata, so delete/recreate them before deploying all functions.
          npx --no-install firebase functions:delete createStripeAccount --region us-central1 --project indii-music-founder --force --non-interactive || true
          npx --no-install firebase functions:delete createTransfer --region us-central1 --project indii-music-founder --force --non-interactive || true
          printf 'INFLUENCER_BOUNTY_BASE_URL=%s\n' "$INFLUENCER_BOUNTY_BASE_URL" > packages/firebase/.env.indii-music-founder
          npm run build -w packages/firebase
          npx --no-install firebase deploy --only functions --project indii-music-founder --non-interactive --force

      - name: Pipeline health summary
        run: |
          echo "══════════════════════════════════════════"
          echo "       PIPELINE HEALTH SUMMARY"
          echo "══════════════════════════════════════════"
          echo "Hosting, staging e2e, and Cloud Functions deploy completed successfully."
          echo "══════════════════════════════════════════"

      - name: Cleanup credentials
        if: always()
        run: rm -f $HOME/gcloud-key.json
