name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: read
  actions: read

jobs:
  # ─── Setup & Sanity Checks ──────────────────────────────────────────────────
  # Prepares dependencies and runs fast sanity checks to fail early.
  setup:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm ci --prefer-offline --no-audit

      - name: Sanity check - Duplicate identifiers (Item 342)
        run: |
          if [ -f packages/renderer/src/core/store/slices/appSlice.ts ]; then
            duplicates=$(grep -rn "^  _last\|^  _cached\|^  current\|^  is" packages/renderer/src/core/store/slices/appSlice.ts | sort | uniq -d)
            if [ -n "$duplicates" ]; then
              echo "::error::Duplicate identifiers found in appSlice.ts"
              echo "$duplicates"
              exit 1
            fi
          fi

      - name: Sanity check - Electron mocks
        run: |
          if [ -d packages/main/src ]; then
            missing_mocks=$(grep -rLE "vi\.(do)?[Mm]ock.*electron" packages/main/src --include="*.test.ts" | xargs grep -l "electron" 2>/dev/null || true)
            if [ -n "$missing_mocks" ]; then
              echo "::error::Missing vi.mock('electron') in packages/main/ tests"
              echo "$missing_mocks"
              exit 1
            fi
          fi

      - name: Scan for secrets (gitleaks)
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Unit Testing (Sharded) ────────────────────────────────────────────────
  # Item 344: Vitest test sharding — 4 parallel matrix jobs cut CI time ~4x
  unit-tests:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    needs: setup
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run unit tests (shard ${{ matrix.shard }}/4)
        timeout-minutes: 15
        run: npm test -- --run --reporter=verbose --pool=forks --testTimeout=30000 --bail=3 --shard=${{ matrix.shard }}/4
        env:
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          VITE_VERTEX_PROJECT_ID: ${{ secrets.VITE_VERTEX_PROJECT_ID }}
          VITE_VERTEX_LOCATION: ${{ secrets.VITE_VERTEX_LOCATION }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_CHECK_DEBUG_TOKEN: ${{ secrets.VITE_FIREBASE_APP_CHECK_DEBUG_TOKEN }}

  # ─── Build & Static Analysis ────────────────────────────────────────────────
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    needs: unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Item 252: Security audit — non-blocking
      - name: Audit dependencies for vulnerabilities (Item 252)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Run linting checks
        run: npm run lint

      - name: TypeScript type check (Item 343)
        run: npm run typecheck

      - name: Build landing page
        run: |
          cd packages/landing
          rm -rf dist .next
          NODE_ENV=production npm run build

      - name: Build studio app
        run: npm run build:studio
        env:
          NODE_ENV: production
          VITE_APP_TARGET: web
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          VITE_VERTEX_PROJECT_ID: ${{ secrets.VITE_VERTEX_PROJECT_ID }}
          VITE_VERTEX_LOCATION: ${{ secrets.VITE_VERTEX_LOCATION }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_APP_CHECK_KEY: ${{ secrets.VITE_FIREBASE_APP_CHECK_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_USE_FINE_TUNED_AGENTS: "true"

      - name: Verify build outputs
        run: |
          ls -la packages/landing/dist/index.html
          ls -la dist/renderer/index.html

      - name: Bundle size check
        run: |
          TOTAL_JS=$(find dist/renderer/assets -name '*.js' -print0 | xargs -0 cat | wc -c)
          TOTAL_KB=$((TOTAL_JS / 1024))
          echo "Total JS: ${TOTAL_KB}KB ($(echo "scale=1; $TOTAL_KB / 1024" | bc)MB)"
          # Threshold: 25MB
          if [ "$TOTAL_JS" -gt 26214400 ]; then
            echo "::error::Total JS bundle exceeds 25MB threshold! Current: ${TOTAL_KB}KB"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dist-${{ github.sha }}
          path: |
            dist/
            packages/landing/dist/
          retention-days: 1

  # ─── Staging Deploy ──────────────────────────────────────────────────────────
  deploy-staging:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    needs: build
    outputs:
      staging-url: ${{ steps.channel-deploy.outputs.staging_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist-${{ github.sha }}

      - name: Authenticate with Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' | base64 -d > $HOME/gcloud-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcloud-key.json" >> $GITHUB_ENV

      - name: Deploy to staging preview channel
        id: channel-deploy
        run: |
          set -uo pipefail
          set +e
          OUTPUT=$(npx firebase hosting:channel:deploy staging \
            --project indii-v-1-1 \
            --expires 2h \
            --only app \
            --json 2>&1)
          EXIT_CODE=$?
          set -e
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Firebase deploy failed"
            echo "$OUTPUT"
            exit $EXIT_CODE
          fi
          
          STAGING_URL=$(echo "$OUTPUT" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          results = d.get('result', {})
          url = next(iter(results.values()), {}).get('url', '')
          if not url:
              sys.exit(1)
          print(url)
          ")
          echo "staging_url=${STAGING_URL}" >> $GITHUB_OUTPUT

      - name: Cleanup credentials
        if: always()
        run: rm -f $HOME/gcloud-key.json

  # ─── E2E Smoke Tests Against Staging ─────────────────────────────────────────
  e2e-staging:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    needs: deploy-staging
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests against staging
        run: npx playwright test e2e/navigation.spec.ts e2e/auth-flow.spec.ts --project=chromium --timeout=30000
        timeout-minutes: 15
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy-staging.outputs.staging-url }}
          E2E_STUDIO_URL: ${{ needs.deploy-staging.outputs.staging-url }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}

  # ─── Production Deploy ──────────────────────────────────────────────────────
  deploy-production:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    needs: [deploy-staging, e2e-staging]
    if: ${{ always() && needs.deploy-staging.result == 'success' }}
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist-${{ github.sha }}

      - name: Authenticate with Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' | base64 -d > $HOME/gcloud-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcloud-key.json" >> $GITHUB_ENV

      - name: Deploy landing page to Firebase Hosting
        run: npx firebase deploy --only hosting:landing --project indii-v-1-1 --non-interactive

      - name: Deploy studio app to Firebase Hosting
        run: npx firebase deploy --only hosting:app --project indii-v-1-1 --non-interactive

      - name: Deploy Cloud Functions
        continue-on-error: true
        run: |
          npm run build -w packages/firebase
          npx firebase deploy --only functions --project indii-v-1-1 --non-interactive --force

      - name: Pipeline health summary
        if: always()
        run: |
          echo "══════════════════════════════════════════"
          echo "       PIPELINE HEALTH SUMMARY"
          echo "══════════════════════════════════════════"
          echo "All critical steps passed successfully."
          echo "Check job logs for non-blocking audit warnings."
          echo "══════════════════════════════════════════"

      - name: Cleanup credentials
        if: always()
        run: rm -f $HOME/gcloud-key.json
