name: Build and Test

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'artifacts/**'
      - '.agent/**'
      - 'deep-test-*.png'
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build for all platforms (macOS/Windows)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.build_all }}" == "true" ]]; then
            echo 'matrix=["macos-latest", "windows-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: read
      actions: read

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24.x'
        cache: 'npm'

    - name: Install system dependencies (Linux)
      run: |
        sudo apt-get update
        sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libgbm1 libpangocairo-1.0-0 libxss1 libgtk-3-0 libsecret-1-dev
        sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2
    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Frontend API boundary guard
      run: npm run security:frontend-api-boundary

    - name: Typecheck
      run: npm run typecheck

  build:
    needs: [test, setup-matrix]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    
    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24.x'
        cache: 'npm'

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libgbm1 libpangocairo-1.0-0 libxss1 libgtk-3-0 libsecret-1-dev
        sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

    - name: Install dependencies
      run: npm ci

    - name: Build shared package
      run: npx tsc -b packages/shared

    # Item 376: Windows code signing — inject WINDOWS_CERTIFICATE secret for NSIS installer
    - name: Decode Windows certificate
      if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
      shell: pwsh
      env:
        WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      run: |
        $certBytes = [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
        [System.IO.File]::WriteAllBytes("win_cert.pfx", $certBytes)
        Import-PfxCertificate -FilePath win_cert.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)
        Remove-Item win_cert.pfx -Force

    - name: Build Electron App
      run: npm run build
      env:
        NODE_OPTIONS: "--max-old-space-size=4096"
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
        WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        CSC_IDENTITY_AUTO_DISCOVERY: true
        VITE_USE_FINE_TUNED_AGENTS: ${{ secrets.VITE_USE_FINE_TUNED_AGENTS }}
        VITE_FUNCTIONS_URL: ${{ secrets.VITE_FUNCTIONS_URL }}
        VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        VITE_FIREBASE_APP_CHECK_KEY: ${{ secrets.VITE_FIREBASE_APP_CHECK_KEY }}
        VITE_INGESTION_SYSTEM_IDENTIFIER: ${{ secrets.VITE_INGESTION_SYSTEM_IDENTIFIER }}
        VITE_INGESTION_ENTITY_NAME: ${{ secrets.VITE_INGESTION_ENTITY_NAME }}
        SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
        TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        META_APP_ID: ${{ secrets.META_APP_ID }}
        META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        PANDADOC_API_KEY: ${{ secrets.PANDADOC_API_KEY }}
        PANDADOC_WEBHOOK_SECRET: ${{ secrets.PANDADOC_WEBHOOK_SECRET }}
        STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        VITE_DDEX_DPID_SPOTIFY: ${{ secrets.VITE_DDEX_DPID_SPOTIFY }}
        PRINTFUL_API_KEY: ${{ secrets.PRINTFUL_API_KEY }}

    # Until production signing certificates are provisioned, Founder desktop
    # downloads are replaced manually and must not enter the auto-update feed.
    - name: Package unsigned Founder installer
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_all }}
      shell: bash
      run: |
        case "$RUNNER_OS" in
          macOS)
            npx electron-builder --mac --arm64 --publish never -c.mac.notarize=false
            ;;
          Windows)
            npx electron-builder --win --x64 --publish never
            ;;
          *)
            echo "Unsupported Founder installer platform: $RUNNER_OS"
            exit 1
            ;;
        esac
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: false

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.os }}
        path: dist/
        retention-days: 5

    - name: Upload Founder installer
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_all }}
      uses: actions/upload-artifact@v4
      with:
        name: founder-installer-${{ runner.os }}-${{ github.sha }}
        path: |
          dist-electron/*.dmg
          dist-electron/*.exe
        if-no-files-found: error
        retention-days: 2

  deploy-founder-downloads:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_all }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v5

    - name: Download Founder installers
      uses: actions/download-artifact@v4
      with:
        pattern: founder-installer-*-${{ github.sha }}
        path: founder-installers
        merge-multiple: true

    - name: Verify installer set and version
      shell: bash
      run: |
        set -euo pipefail
        EXPECTED_VERSION=$(node -p "require('./package.json').version")
        MAC_FILE=$(find founder-installers -maxdepth 1 -name "*.dmg" -type f)
        WIN_FILE=$(find founder-installers -maxdepth 1 -name "*.exe" -type f)
        test "$(printf '%s\n' "$MAC_FILE" | grep -c .)" -eq 1
        test "$(printf '%s\n' "$WIN_FILE" | grep -c .)" -eq 1
        [[ "$(basename "$MAC_FILE")" == *"$EXPECTED_VERSION"* ]]
        [[ "$(basename "$WIN_FILE")" == *"$EXPECTED_VERSION"* ]]
        echo "MAC_FILE=$MAC_FILE" >> "$GITHUB_ENV"
        echo "WIN_FILE=$WIN_FILE" >> "$GITHUB_ENV"
        echo "Verified Founder installers for version $EXPECTED_VERSION"
        sha256sum "$MAC_FILE" "$WIN_FILE"

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v3

    - name: Authenticate with Google Cloud
      shell: bash
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      run: |
        set -euo pipefail
        KEY_FILE="$RUNNER_TEMP/gcloud-key.json"
        if echo "$FIREBASE_SERVICE_ACCOUNT" | base64 -d > "$KEY_FILE" 2>/dev/null; then
          :
        else
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$KEY_FILE"
        fi
        gcloud auth activate-service-account --key-file="$KEY_FILE"
        gcloud config set project indii-music-founder

    - name: Replace and clean Founder downloads
      shell: bash
      run: |
        set -euo pipefail
        BUCKET="gs://indii-music-founder.firebasestorage.app/founders/releases"
        gcloud storage cp "$MAC_FILE" "$BUCKET/indii-Installer.dmg" \
          --content-type=application/x-apple-diskimage --cache-control=no-cache
        gcloud storage cp "$WIN_FILE" "$BUCKET/indii-Setup.exe" \
          --content-type=application/vnd.microsoft.portable-executable --cache-control=no-cache

        MAC_MD5=$(openssl md5 -binary "$MAC_FILE" | openssl base64 -A)
        WIN_MD5=$(openssl md5 -binary "$WIN_FILE" | openssl base64 -A)
        test "$MAC_MD5" = "$(gcloud storage objects describe "$BUCKET/indii-Installer.dmg" --format='value(md5_hash)')"
        test "$WIN_MD5" = "$(gcloud storage objects describe "$BUCKET/indii-Setup.exe" --format='value(md5_hash)')"

        for STALE_OBJECT in indii-Installer.AppImage latest-mac.yml latest.yml; do
          if gcloud storage objects describe "$BUCKET/$STALE_OBJECT" >/dev/null 2>&1; then
            gcloud storage rm "$BUCKET/$STALE_OBJECT"
          fi
        done

        OBJECTS=$(gcloud storage ls "$BUCKET/**")
        printf '%s\n' "$OBJECTS"
        test "$(printf '%s\n' "$OBJECTS" | grep -c .)" -eq 2
        printf '%s\n' "$OBJECTS" | grep -Fx "$BUCKET/indii-Installer.dmg"
        printf '%s\n' "$OBJECTS" | grep -Fx "$BUCKET/indii-Setup.exe"

    - name: Cleanup credentials
      if: always()
      shell: bash
      run: rm -f "$RUNNER_TEMP/gcloud-key.json"
