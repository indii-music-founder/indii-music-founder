name: Release

# Triggered by a version tag (e.g. v1.2.3). Builds all platforms and
# publishes distributable artifacts to GitHub Releases so electron-updater
# can find and serve them to installed desktop clients.
on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # required to create/modify GitHub Releases

jobs:
  release:
    name: Build & publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libgbm1 \
            libpangocairo-1.0-0 libxss1 libgtk-3-0 libsecret-1-dev
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # macOS code signing — uses Apple certificates from GitHub secrets.
      # Leave CSC_LINK / CSC_KEY_PASSWORD empty on forks; signing is skipped.
      - name: Build & publish desktop installer
        run: |
          npm run build:studio
          npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing (optional — set these secrets to enable)
          # CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          # CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: true
          # Windows signing (optional)
          # WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Authenticate with Google Cloud
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if echo "$FIREBASE_SERVICE_ACCOUNT" | base64 -d >/dev/null 2>&1; then
            echo "$FIREBASE_SERVICE_ACCOUNT" | base64 -d > $HOME/gcloud-key.json
          else
            echo "$FIREBASE_SERVICE_ACCOUNT" > $HOME/gcloud-key.json
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcloud-key.json" >> $GITHUB_ENV
          gcloud auth activate-service-account --key-file="$HOME/gcloud-key.json"
          gcloud config set project indii-music-founder

      - name: Upload Installer to Firebase Storage (macOS)
        if: runner.os == 'macOS'
        run: |
          DMG_FILE=$(find dist-electron -maxdepth 1 -name "*.dmg" -type f | head -n 1)
          if [ -z "$DMG_FILE" ]; then
            echo "No DMG artifact found in dist-electron"
            exit 1
          fi
          gcloud storage cp "$DMG_FILE" "gs://indii-music-founder.firebasestorage.app/founders/releases/indii-Installer.dmg" \
            --content-type=application/x-apple-diskimage
          
          YML_FILE=$(find dist-electron -maxdepth 1 -name "latest-mac.yml" -type f | head -n 1)
          if [ -n "$YML_FILE" ]; then
            gcloud storage cp "$YML_FILE" "gs://indii-music-founder.firebasestorage.app/founders/releases/latest-mac.yml" \
              --content-type=text/yaml
          fi

      - name: Upload Installer to Firebase Storage (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          EXE_FILE=$(find dist-electron -maxdepth 1 -name "*.exe" -type f | head -n 1)
          if [ -z "$EXE_FILE" ]; then
            echo "No Windows EXE artifact found in dist-electron"
            exit 1
          fi
          gcloud storage cp "$EXE_FILE" "gs://indii-music-founder.firebasestorage.app/founders/releases/indii-Setup.exe" \
            --content-type=application/vnd.microsoft.portable-executable

          YML_FILE=$(find dist-electron -maxdepth 1 -name "latest.yml" -type f | head -n 1)
          if [ -n "$YML_FILE" ]; then
            gcloud storage cp "$YML_FILE" "gs://indii-music-founder.firebasestorage.app/founders/releases/latest.yml" \
              --content-type=text/yaml
          fi

      - name: Upload Installer to Firebase Storage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          APPIMAGE_FILE=$(find dist-electron -maxdepth 1 -name "*.AppImage" -type f | head -n 1)
          if [ -n "$APPIMAGE_FILE" ]; then
            gcloud storage cp "$APPIMAGE_FILE" "gs://indii-music-founder.firebasestorage.app/founders/releases/indii-Installer.AppImage" \
              --content-type=application/vnd.appimage
          else
            echo "No Linux AppImage artifact found in dist-electron; skipping optional Linux Founder upload."
          fi

      - name: Cleanup credentials
        if: always()
        shell: bash
        run: rm -f $HOME/gcloud-key.json
