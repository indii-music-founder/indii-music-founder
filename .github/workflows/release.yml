name: Release

# Triggered by a version tag (e.g. v1.2.3). Builds all platforms and
# publishes distributable artifacts to GitHub Releases so electron-updater
# can find and serve them to installed desktop clients.
on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # required to create/modify GitHub Releases

env:
  NODE_OPTIONS: "--max-old-space-size=6144"

jobs:
  release:
    name: Build & publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libgbm1 \
            libpangocairo-1.0-0 libxss1 libgtk-3-0 libsecret-1-dev
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Prepare Code Signing Environment
        shell: bash
        run: |
          MAC_CERT="${{ secrets.MAC_CERTIFICATE_P12_BASE64 || secrets.CSC_LINK }}"
          if [ -n "$MAC_CERT" ]; then
            echo "CSC_LINK=$MAC_CERT" >> $GITHUB_ENV
          fi
          
          MAC_PASS="${{ secrets.MAC_CERTIFICATE_PASSWORD || secrets.CSC_KEY_PASSWORD }}"
          if [ -n "$MAC_PASS" ]; then
            echo "CSC_KEY_PASSWORD=$MAC_PASS" >> $GITHUB_ENV
          fi
          
          WIN_CERT="${{ secrets.WINDOWS_CERTIFICATE || secrets.WIN_CSC_LINK }}"
          if [ -n "$WIN_CERT" ]; then
            echo "WIN_CSC_LINK=$WIN_CERT" >> $GITHUB_ENV
          fi
          
          WIN_PASS="${{ secrets.WINDOWS_CERTIFICATE_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}"
          if [ -n "$WIN_PASS" ]; then
            echo "WIN_CSC_KEY_PASSWORD=$WIN_PASS" >> $GITHUB_ENV
          fi
          
          APPLE_EMAIL="${{ secrets.APPLE_ID }}"
          if [ -n "$APPLE_EMAIL" ]; then
            echo "APPLE_ID=$APPLE_EMAIL" >> $GITHUB_ENV
          fi
          
          APPLE_SPEC_PASS="${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}"
          if [ -n "$APPLE_SPEC_PASS" ]; then
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_SPEC_PASS" >> $GITHUB_ENV
          fi
          
          APPLE_TEAM="${{ secrets.APPLE_TEAM_ID }}"
          if [ -n "$APPLE_TEAM" ]; then
            echo "APPLE_TEAM_ID=$APPLE_TEAM" >> $GITHUB_ENV
          fi

      # ISSUE-992: signing/notarization secrets are REQUIRED on macOS, not optional.
      # An ad-hoc-signed build has no resource seal and Squirrel/ShipIt correctly
      # refuses to install it — publishing one traps every user in a repeat-
      # failure update loop. Fail before any build work starts.
      - name: Require macOS signing & notarization secrets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          missing=()
          [ -z "${{ secrets.MAC_CERTIFICATE_P12_BASE64 || secrets.CSC_LINK }}" ] && missing+=("MAC_CERTIFICATE_P12_BASE64/CSC_LINK")
          [ -z "${{ secrets.MAC_CERTIFICATE_PASSWORD || secrets.CSC_KEY_PASSWORD }}" ] && missing+=("MAC_CERTIFICATE_PASSWORD/CSC_KEY_PASSWORD")
          [ -z "${{ secrets.APPLE_ID }}" ] && missing+=("APPLE_ID")
          [ -z "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" ] && missing+=("APPLE_APP_SPECIFIC_PASSWORD")
          [ -z "${{ secrets.APPLE_TEAM_ID }}" ] && missing+=("APPLE_TEAM_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required macOS signing/notarization secrets: ${missing[*]}"
            echo "An ad-hoc-signed build cannot pass ShipIt's resource-seal check and must never be published. See docs/RELEASE_CHECKLIST.md."
            exit 1
          fi

      # Build only — publishing is a separate, gated step below so the exact
      # verified artifact is what gets uploaded (no re-build, no hash drift).
      - name: Build desktop installer
        run: |
          npm run build:studio
          npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: true
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # ISSUE-992: verify the EXACT built artifact — Developer ID signature
      # (not ad-hoc), resource seal present, Gatekeeper acceptance, and
      # notarization staple — before it is ever allowed onto the update feed.
      - name: Verify macOS code signature, seal, and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=$(find dist-electron -maxdepth 2 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle found in dist-electron"
            exit 1
          fi
          echo "Verifying: $APP_PATH"

          codesign --verify --deep --strict --verbose=4 "$APP_PATH"

          SIGN_INFO=$(codesign -d -vvv "$APP_PATH" 2>&1)
          echo "$SIGN_INFO"
          if echo "$SIGN_INFO" | grep -qE "Signature=adhoc|TeamIdentifier=not set"; then
            echo "::error::App is ad-hoc signed or missing a Team Identifier — refusing to publish."
            exit 1
          fi

          spctl --assess --type execute --verbose=4 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

          ZIP_FILE=$(find dist-electron -maxdepth 1 -name "*-mac.zip" -type f | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No updater zip (*-mac.zip) found in dist-electron"
            exit 1
          fi
          if ! unzip -l "$ZIP_FILE" | grep -q "_CodeSignature/CodeResources"; then
            echo "::error::$ZIP_FILE has no _CodeSignature/CodeResources entry — this is the exact ShipIt failure from ISSUE-992."
            exit 1
          fi
          echo "macOS signature, seal, and notarization verified for $ZIP_FILE"

      - name: Publish verified installer to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --draft=false 2>/dev/null || true

          shopt -s nullglob
          FILES=(dist-electron/*.dmg dist-electron/*.dmg.blockmap dist-electron/*-mac.zip dist-electron/*-mac.zip.blockmap \
                  dist-electron/*.exe dist-electron/*.exe.blockmap dist-electron/*.AppImage \
                  dist-electron/latest-mac.yml dist-electron/latest.yml dist-electron/latest-linux.yml)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::No release artifacts found in dist-electron to upload"
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify updater manifest was published
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$RUNNER_OS" in
            macOS)
              MANIFEST="latest-mac.yml"
              ;;
            Windows)
              MANIFEST="latest.yml"
              ;;
            Linux)
              MANIFEST="latest-linux.yml"
              ;;
            *)
              echo "Unsupported runner OS for updater manifest verification: $RUNNER_OS"
              exit 1
              ;;
          esac

          if [ ! -f "dist-electron/$MANIFEST" ]; then
            echo "Missing local updater manifest: dist-electron/$MANIFEST"
            echo "dist-electron contents:"
            find dist-electron -maxdepth 1 -type f -print | sort
            exit 1
          fi

          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx "$MANIFEST"; then
            echo "GitHub release $GITHUB_REF_NAME is missing updater manifest asset: $MANIFEST"
            echo "Release assets currently published:"
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' || true
            exit 1
          fi

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Authenticate with Google Cloud
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if echo "$FIREBASE_SERVICE_ACCOUNT" | base64 -d >/dev/null 2>&1; then
            echo "$FIREBASE_SERVICE_ACCOUNT" | base64 -d > $HOME/gcloud-key.json
          else
            echo "$FIREBASE_SERVICE_ACCOUNT" > $HOME/gcloud-key.json
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcloud-key.json" >> $GITHUB_ENV
          gcloud auth activate-service-account --key-file="$HOME/gcloud-key.json"
          gcloud config set project indii-music-founder

      - name: Upload Installer to Firebase Storage (macOS)
        if: runner.os == 'macOS'
        run: |
          DMG_FILE=$(find dist-electron -maxdepth 1 -name "*.dmg" -type f | head -n 1)
          if [ -z "$DMG_FILE" ]; then
            echo "No DMG artifact found in dist-electron"
            exit 1
          fi
          gcloud storage cp "$DMG_FILE" "gs://indii-music-founder.firebasestorage.app/founders/releases/indii-Installer.dmg" \
            --content-type=application/x-apple-diskimage
          
          YML_FILE=$(find dist-electron -maxdepth 1 -name "latest-mac.yml" -type f | head -n 1)
          if [ -z "$YML_FILE" ]; then
            echo "No latest-mac.yml artifact found in dist-electron"
            exit 1
          fi
          gcloud storage cp "$YML_FILE" "gs://indii-music-founder.firebasestorage.app/founders/releases/latest-mac.yml" \
            --content-type=text/yaml

      - name: Upload Installer to Firebase Storage (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          EXE_FILE=$(find dist-electron -maxdepth 1 -name "*.exe" -type f | head -n 1)
          if [ -z "$EXE_FILE" ]; then
            echo "No Windows EXE artifact found in dist-electron"
            exit 1
          fi
          gcloud storage cp "$EXE_FILE" "gs://indii-music-founder.firebasestorage.app/founders/releases/indii-Setup.exe" \
            --content-type=application/vnd.microsoft.portable-executable

          YML_FILE=$(find dist-electron -maxdepth 1 -name "latest.yml" -type f | head -n 1)
          if [ -z "$YML_FILE" ]; then
            echo "No latest.yml artifact found in dist-electron"
            exit 1
          fi
          gcloud storage cp "$YML_FILE" "gs://indii-music-founder.firebasestorage.app/founders/releases/latest.yml" \
            --content-type=text/yaml

      - name: Upload Installer to Firebase Storage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          APPIMAGE_FILE=$(find dist-electron -maxdepth 1 -name "*.AppImage" -type f | head -n 1)
          if [ -n "$APPIMAGE_FILE" ]; then
            gcloud storage cp "$APPIMAGE_FILE" "gs://indii-music-founder.firebasestorage.app/founders/releases/indii-Installer.AppImage" \
              --content-type=application/vnd.appimage
          else
            echo "No Linux AppImage artifact found in dist-electron; skipping optional Linux Founder upload."
          fi

      - name: Cleanup credentials
        if: always()
        shell: bash
        run: rm -f $HOME/gcloud-key.json
