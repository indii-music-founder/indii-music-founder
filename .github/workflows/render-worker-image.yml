name: Render worker image

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/render-worker/**'
      - 'packages/video-compiler/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.dockerignore'
      - '.github/workflows/render-worker-image.yml'
      - '!**/*.md'
  push:
    branches: [main]
    paths:
      - 'packages/render-worker/**'
      - 'packages/video-compiler/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.dockerignore'
      - '.github/workflows/render-worker-image.yml'
      - '!**/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: memory=5g
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/render-worker/Dockerfile
          push: false
          cache-from: type=gha,scope=render-worker
          cache-to: type=gha,scope=render-worker,mode=max
